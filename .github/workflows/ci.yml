name: build-and-test

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Vigilancia continua de vulnerabilidades (CRA Anexo I, parte II): cada lunes a las 06:00 UTC
    - cron: "0 6 * * 1"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dependencias de host
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential rsync bc cpio unzip file wget \
            libssl-dev libgnutls28-dev python3 qemu-system-arm xxd

      - name: Caché de descargas
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-${{ hashFiles('br2-external/configs/*_defconfig', 'Makefile') }}
          restore-keys: dl-

      - name: Caché de ccache
        uses: actions/cache@v4
        with:
          path: ~/.buildroot-ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Compilar
        run: make

      - name: SBOM (CycloneDX)
        run: make sbom

      - name: Semana actual (clave de caché de NVD)
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Caché de NVD y de las CVE del kernel
        uses: actions/cache@v4
        with:
          path: |
            nvd
            kernel-vulns
          key: vulndb-${{ steps.week.outputs.week }}
          restore-keys: vulndb-

      - name: Bases de vulnerabilidades (clones superficiales; cve-check actualiza NVD)
        run: |
          if [ ! -d nvd/git/.git ]; then
            git clone -q --depth 1 https://github.com/fkie-cad/nvd-json-data-feeds/ nvd/git
          fi
          if [ -d kernel-vulns/.git ]; then
            git -C kernel-vulns pull -q --depth 1 || true
          else
            git clone -q --depth 1 https://git.kernel.org/pub/scm/linux/security/vulns.git kernel-vulns
          fi

      - name: Vulnerabilidades + VEX
        run: make cve

      - name: Informe en el resumen de la ejecución
        if: always()
        run: cat output/sbom/vulnerabilidades.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Pruebas (arranque, endurecimiento, arranque verificado y actualizaciones A/B)
        if: always()
        run: |
          set -o pipefail
          make test 2>&1 | tee test.log

      - name: Diagnóstico de pruebas (anotaciones públicas)
        if: failure()
        run: |
          grep -aE "FAIL|Error|ERROR|error|panic|RECHAZADO|timeout|Traceback|No such|denied|qemu-system" test.log \
            | grep -av "^\s*$" | tail -40 | sed 's/^/::error::/' || true
          tail -60 test.log | sed 's/^/::warning::/' || true

      - name: Publicar artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cra-demo-images
          path: |
            output/images/u-boot.bin
            output/images/u-boot-control.dtb
            output/images/fitImage
            output/images/update.raucb
            output/images/disk.img
            output/sbom/sbom.cdx.json
            output/sbom/sbom-build.cdx.json
            output/sbom/sbom-vuln.cdx.json
            output/sbom/vex.cdx.json
            output/sbom/vulnerabilidades.md
