# Sesión 5: A/B + estado de arranque + datos
#   p1 rootfs A · p2 rootfs B · p3 bootstate (FAT, compartida con U-Boot) · p4 datos (ext4)
image bootstate.vfat {
	vfat {
		label = "BOOTSTATE"
		files = { "bootstate.txt" }
	}
	size = 8M
}

image data.ext4 {
	ext4 {
		label = "data"
	}
	size = 32M
}

image disk.img {
	hdimage {
		partition-table-type = "mbr"
	}

	partition rootfsA {
		partition-type = 0x83
		image = "rootfs.ext4"
	}

	partition rootfsB {
		partition-type = 0x83
		image = "rootfs.ext4"
	}

	partition bootstate {
		partition-type = 0x0C
		image = "bootstate.vfat"
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
