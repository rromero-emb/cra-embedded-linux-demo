[system]
compatible=cra-demo-qemu-aarch64
bootloader=custom
data-directory=/data/rauc
# Solo paquetes en formato verity (se rechaza el formato "plain")
bundle-formats=-plain

[handlers]
bootloader-custom-backend=/usr/lib/rauc/bootloader-custom
# Anti-rollback: rechaza paquetes con versión inferior a la instalada
pre-install=/usr/lib/rauc/pre-install

[keyring]
# CA de actualizaciones (se instala en post-build desde keys/rauc/ca.crt)
path=/etc/rauc/keyring.pem
# El certificado de firma debe ser de tipo Code Signing (EKU)
check-purpose=codesign

[slot.rootfs.0]
device=/dev/vda1
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/vda2
type=ext4
bootname=B
