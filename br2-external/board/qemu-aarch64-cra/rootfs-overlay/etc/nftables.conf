#!/usr/sbin/nft -f
# Cortafuegos de la demo CRA: todo cerrado salvo lo imprescindible (CRA Anexo I: superficie mínima)
flush ruleset

table inet filter {
	chain input {
		type filter hook input priority 0; policy drop;
		iif "lo" accept
		ct state established,related accept
		ct state invalid drop
		ip protocol icmp icmp type echo-request limit rate 5/second accept
		ip6 nexthdr icmpv6 accept
		udp sport 67 udp dport 68 accept                       # respuestas DHCP
		tcp dport 22 ct state new limit rate 10/minute accept  # SSH con límite
		limit rate 5/minute log prefix "nft-input-drop: " level info
	}

	chain forward {
		type filter hook forward priority 0; policy drop;
	}

	chain output {
		type filter hook output priority 0; policy drop;
		oif "lo" accept
		ct state established,related accept
		udp dport { 53, 67, 123 } accept   # DNS, DHCP, NTP
		tcp dport { 53, 443 } accept       # DNS, HTTPS (actualizaciones)
		ip protocol icmp accept
		ip6 nexthdr icmpv6 accept
		limit rate 5/minute log prefix "nft-output-drop: " level info
	}
}
